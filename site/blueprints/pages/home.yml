title: Homepage
preset: page
icon: home

tabs:
  content:
    label: Inhalt
    icon: text
    columns:
      left:
        width: 2/3
        fields:
          heroOverline:
            label: Hero Overline
            type: text
            help: Kleine Zeile über der Hauptüberschrift
          heroTitle:
            label: Hero Titel
            type: text
            required: true
          heroSubline:
            label: Hero Untertitel
            type: textarea
            size: small
          heroButtonText:
            label: Button Text
            type: text
          heroButtonUrl:
            label: Button URL
            type: url
          text:
            label: Zusätzlicher Inhalt
            type: textarea
            size: large
      right:
        width: 1/3
        fields:
          metaDescription:
            label: Meta Description
            type: textarea
            maxlength: 160
